  <!-- Instant Theme Initialization Script (Theme Initializer) -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('pref-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var bg = theme === 'dark' ? '#06070d' : '#f8fafc';
      document.documentElement.style.backgroundColor = bg;
      document.write('<style>html,body{background-color:' + bg + ' !important; color-scheme:' + theme + ' !important; transition: none !important;}  .loader{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:transparent !important;backdrop-filter:blur(16px) !important;-webkit-backdrop-filter:blur(16px) !important;z-index:9999;opacity:1;visibility:visible}</style>');
    })();
  </script>
